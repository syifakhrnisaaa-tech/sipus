<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SIPUS — Sistem Informasi Peminjaman Buku Perpustakaan Kampus">
  <title>SIPUS — Sistem Informasi Perpustakaan Kampus</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ============================================================
       HALAMAN LOGIN (ditampilkan sebelum sesi pengguna terbentuk)
  ============================================================ -->
  <div id="login-view" class="login-view hidden">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-logo">S</div>
        <h1>SIPUS</h1>
        <p>Sistem Informasi Perpustakaan Kampus</p>
      </div>

      <form id="login-form" autocomplete="off" novalidate>
        <div class="form-group">
          <label for="login-username">Nama Pengguna</label>
          <input type="text" id="login-username" placeholder="mis. petugas" required>
        </div>
        <div class="form-group">
          <label for="login-password">Kata Sandi</label>
          <input type="password" id="login-password" placeholder="••••••••" required>
        </div>
        <p id="login-error" class="login-error hidden"></p>
        <button type="submit" class="btn btn-primary btn-block">Masuk</button>
      </form>

      <div class="login-demo">
        <h3>Akun Demo</h3>
        <table class="login-demo-table">
          <thead>
            <tr><th>Peran</th><th>Nama Pengguna</th><th>Kata Sandi</th></tr>
          </thead>
          <tbody>
            <tr>
              <td><span class="badge badge-petugas">Petugas</span></td>
              <td>petugas</td>
              <td>petugas123</td>
            </tr>
            <tr>
              <td><span class="badge badge-anggota">Anggota</span></td>
              <td>mahasiswa</td>
              <td>mahasiswa123</td>
            </tr>
          </tbody>
        </table>
        <p class="login-note">Autentikasi di sini hanya simulasi lokal dan tidak aman untuk produksi.</p>
      </div>
    </div>
  </div>

  <!-- ============================================================
       KERANGKA APLIKASI: SIDEBAR KIRI + HEADER ATAS + KONTEN
  ============================================================ -->
  <div id="app-view" class="app hidden">

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-logo">S</div>
        <div>
          <strong>SIPUS</strong>
          <span>Perpustakaan Kampus</span>
        </div>
      </div>

      <nav class="sidebar-menu" id="sidebar-menu" aria-label="Menu utama">
        <!-- Item menu dibangun dinamis sesuai hak akses (js/app.js) -->
      </nav>

      <div class="sidebar-footer" id="sidebar-footer"></div>
    </aside>
    <div class="sidebar-overlay" id="sidebar-overlay" hidden></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn" id="menu-toggle" aria-label="Buka menu">☰</button>
        <h2 class="topbar-title" id="page-title">Dashboard</h2>
        <div class="topbar-right">
          <span class="topbar-date" id="topbar-date"></span>
          <span id="topbar-user"></span>
        </div>
      </header>

      <main class="content" id="content">
        <!-- ==================== HALAMAN-HALAMAN ==================== -->

        <section id="page-dashboard" class="page hidden"></section>

        <section id="page-books" class="page hidden"></section>

        <section id="page-members" class="page hidden"></section>

        <section id="page-catalog" class="page hidden"></section>

        <section id="page-loans" class="page hidden"></section>

        <section id="page-returns" class="page hidden"></section>

        <section id="page-reports" class="page hidden"></section>

        <section id="page-my-history" class="page hidden"></section>

        <section id="page-settings" class="page hidden"></section>

      </main>
    </div>
  </div>

  <!-- ==================== MODAL & NOTIFIKASI ==================== -->
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <!-- Input file tersembunyi untuk impor JSON -->
  <input type="file" id="import-file" accept=".json,application/json" class="hidden">

  <!-- Pemuatan script urut (pola klasik, kompatibel dengan file:// tanpa build step) -->
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/books.js"></script>
  <script src="js/members.js"></script>
  <script src="js/transactions.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
